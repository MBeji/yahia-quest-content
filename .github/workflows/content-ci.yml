name: Content CI

# Gates de contenu du corpus privé (étude 24). Le moteur (scripts, schéma zod,
# QA) vit dans le repo public MBeji/yahia-quest-arena : on le checkout à côté du
# corpus, on branche les données par symlink, et on exécute les gates depuis le
# moteur — zéro duplication de code.
#
# Depuis le lot 3b (2026-07-20), ce repo n'est plus un miroir : il est la SEULE
# source du corpus et des skills pédagogiques.
#
# UN SEUL SYMLINK depuis l'étude 32 (lot 5) : `content/`. Il en fallait DEUX
# jusque-là, parce que le registre de transcription `programmes-officiels/`
# vivait sous `.claude/skills/content-ecole-tn/references/` — un registre de
# DONNÉES rangé dans un dossier d'instructions. Il a rejoint `content/`, avec le
# reste des données. Ce second lien n'était pas un détail : c'est la première
# chose qu'une session oublie, et `programme:check` rendait alors un faux
# « rien à faire » sur le garde-fou anti-double-transcription — le pire résultat
# possible pour ce registre. Il causait aussi la collision d'invariants que
# `harness:check --corpus` a dû apprendre à éviter (lot 2) : les 43 skills du
# corpus branchés dans le moteur y faisaient réclamer 225 fichiers de miroir.
#
# `programme:check` (registre de transcription CNP) tournait dans la CI publique
# jusqu'au lot 3b ; il a suivi ses données ici. Les gates suivent leurs données.

on:
  pull_request:
    types: [synchronize, reopened]
  # ⚠️ `opened` est VOLONTAIREMENT absent (étude 32, lot 1 — voie de repli de Q-1).
  # Sans `types:`, GitHub écoute [opened, synchronize, reopened] par défaut, et c'est
  # `opened` qui produisait le fantôme : une PR ouverte par le GITHUB_TOKEN fait
  # ENREGISTRER un run `pull_request` que la garde anti-boucle refuse aussitôt — il
  # sort `failure` à ZÉRO job, sans rien avoir évalué. 3 par PR ici, 21 % des runs du
  # dépôt sur six jours, et trois incidents nés de sa lecture (#280, #291, #293).
  # Rien n'est perdu : `auto-pr.yml` ouvre la PR de toute branche poussée PUIS
  # dispatche les checks qui n'ont pas de run réel sur le SHA — sur CHAQUE
  # poussée.
  # ⚠️ Cette ligne disait « et `synchronize` couvre chaque poussée suivante ».
  # C'était faux, et ça a laissé huit commits sans gate sur la PR #387 : une PR
  # ouverte par le `GITHUB_TOKEN` n'émet AUCUN événement `pull_request` de toute
  # sa vie, pas seulement à l'ouverture. `synchronize` ne couvre donc que les PR
  # ouvertes à la main. Voir le filet de `auto-pr.yml`, qui est ce qui tient
  # réellement pour les autres.
  # ⚠️ Cas résiduel assumé : une PR ouverte À LA MAIN sur une branche qui n'a plus
  # bougé depuis n'a aucun check — elle ne peut donc pas merger (`automerge` refuse un
  # SHA sans check run) et reste visible plutôt que de passer en douce. La sortir de là
  # tient en un `workflow_dispatch` ou une poussée.
  push:
    branches: [main]
  # Indispensable à `auto-pr.yml`, pas un confort : une PR ouverte par le
  # GITHUB_TOKEN n'émet PAS d'événement `pull_request` (garde anti-boucle de
  # GitHub), donc ce workflow ne démarrerait jamais sur elle. `automerge.yml`
  # refusant — à raison — de merger un SHA sans aucun check run, la PR
  # dormirait indéfiniment. auto-pr.yml dispatche donc ce workflow lui-même.
  workflow_dispatch:

permissions:
  contents: read
  # Réveiller `automerge.yml` en fin de course — voir la dernière étape. Le bloc
  # `permissions:` REMPLACE le défaut du dépôt, il ne s'y ajoute pas : toute
  # portée non listée tombe à `none`, pas à `read`.
  actions: write

concurrency:
  group: content-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: content:check + qa:strict + figures:check + audit:strict + programme:check + harness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout corpus (ce repo)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: corpus
          # Historique complet : le cliquet `content:tranche --fresh` compare la branche à
          # sa BASE DE FUSION avec main (27 Mo de .git). Un clone à profondeur 1 n'a pas de
          # base de fusion, et le cliquet jugerait alors la tranche d'un autre.
          fetch-depth: 0

      - name: Checkout moteur (repo public)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: MBeji/yahia-quest-arena
          path: engine

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: engine/package-lock.json

      - name: Installer les dépendances du moteur
        working-directory: engine
        run: npm ci --no-audit --no-fund

      - name: Brancher le corpus dans le moteur (un seul lien depuis é32 L5)
        run: |
          set -euo pipefail
          rm -rf engine/content
          ln -s "$GITHUB_WORKSPACE/corpus/content" engine/content
          # Fail fast et lisible si un jour l'arborescence privée bouge. Les deux
          # contrôles portent désormais sur le MÊME lien : le corpus et son registre
          # de transcription sont au même endroit.
          test -f engine/content/misconceptions.json \
            || { echo "::error::corpus non branché (misconceptions.json introuvable)"; exit 1; }
          test -d engine/content/programmes-officiels/manifest \
            || { echo "::error::registre non branché (programmes-officiels/manifest introuvable)"; exit 1; }

      - name: content:check
        working-directory: engine
        run: npm run content:check

      # `content/CATALOGUE.md` est GÉNÉRÉ (`content:catalogue`, moteur) et son en-tête
      # promettait depuis l'origine un contrôle de fraîcheur en CI — qui n'a jamais existé.
      # Constat de l'audit global du 2026-09-12 (arena `docs/audit-global-2026-09-12.md`) :
      # figé au 3 septembre à 90 sujets pendant que l'arbre en comptait 94. Un index qu'on
      # ouvre « pour savoir si une matière existe déjà » et qui ment est pire qu'aucun index.
      # Le générateur écrit à travers le lien `engine/content` → le diff se lit dans CE dépôt.
      - name: content:catalogue (CATALOGUE.md est-il à jour ?)
        working-directory: engine
        run: |
          set -euo pipefail
          npm run content:catalogue
          if ! git -C "$GITHUB_WORKSPACE/corpus" diff --exit-code --stat -- content/CATALOGUE.md; then
            echo "::error file=content/CATALOGUE.md::CATALOGUE.md est périmé — régénérer depuis le moteur lié (npm run content:catalogue) et committer le fichier."
            exit 1
          fi

      - name: content:qa:strict
        working-directory: engine
        run: npm run content:qa:strict

      # Le lint structurel des figures SVG. Il existait depuis l'arena #451 et n'était
      # appelé par AUCUN workflow : il est resté rouge des mois sans que personne le voie,
      # sur 32 signalements dont pas un seul n'était vrai — il interdisait des `<defs>` et
      # des `<marker>` que le sanitizer de l'app garde et que le navigateur dessine
      # (corrigé dans le moteur, arena #936). Un gate que rien ne lance ne protège
      # rien, et un gate qui ment finit ignoré : les deux moitiés se réparent ensemble.
      - name: content:figures:check
        working-directory: engine
        run: npm run content:figures:check

      - name: content:audit:strict
        working-directory: engine
        run: npm run content:audit:strict

      - name: programme:check
        working-directory: engine
        run: npm run programme:check

      # Le CLIQUET de la fuite par la forme (méthode § B2, arena #1102 et suivante). Une
      # question neuve ou modifiée dont la clé est strictement l'option la plus longue se
      # devine sans rien savoir ; mesuré à 61–75 % sur les trois dernières tranches
      # d'arabe 8ᵉ, dont la clé portait sa justification et les distracteurs rien.
      # `--fresh` ne juge QUE ce que la branche ajoute ou change (contre sa base de fusion) :
      # la dette déjà publiée ne rend aucune PR rouge. `--strict-longest` : seule cette
      # fuite bloque — les paires proches et les candidats gabarit restent un rapport
      # pour l'auditeur, lisible dans ce log. Sur `main`, rien n'est « neuf » : no-op.
      - name: content:tranche --fresh (cliquet de la clé la plus longue)
        working-directory: engine
        run: |
          set -euo pipefail
          if ! npm run -s content:tranche -- --changed --fresh --strict-longest; then
            echo "::error::content:tranche — la clé est strictement l'option la plus longue au-delà du hasard sur les questions neuves de cette PR (liste ci-dessus). Raccourcir la clé ou étoffer les distracteurs (même niveau de justification), sans déplacer la clé ; puis relancer localement : npm run content:gates -- --tranche."
            exit 1
          fi

      # Les invariants du HARNESS appliqués à ce dépôt (étude 32, lot 2). Ce dépôt porte
      # 43 skills, 12 workflows et un CLAUDE.md de 9 Kio, et n'avait AUCUN gate de harness :
      # ni budget, ni Unicode invisible, ni conformité à la spec Agent Skills, ni YAML strict.
      # Son seul invariant — l'épinglage des Actions — vivait dans un `pin-check.yml` qui
      # ré-écrivait en bash une règle du moteur ; deux implémentations d'une même règle
      # divergent, ce dépôt l'a vu trois fois sur le test « zéro job ». `pin-check.yml` est
      # donc SUPPRIMÉ dans le même lot : la règle est ici, une seule fois, et elle est testée
      # là où elle est écrite.
      #
      # Le blocage qu'on croyait avoir (« harness:check traîne des dépendances, et le workflow
      # candidat tourne sans npm ci ») venait d'avoir regardé le mauvais workflow : celui-ci
      # checkout déjà le moteur et y fait déjà son `npm ci`. Il n'y avait rien à extraire dans
      # un module sans dépendance, seulement le bon endroit à choisir.
      - name: harness:check --corpus (les invariants du harness sur ce dépôt)
        working-directory: engine
        run: node scripts/harness/check.mjs --corpus "$GITHUB_WORKSPACE/corpus"

      # Réveiller automerge — UNIQUEMENT quand ce run vient d'une dispatch.
      #
      # Le trou, constaté sur la PR #231 : GitHub n'émet PAS d'événement
      # `workflow_run` pour un run déclenché par le `GITHUB_TOKEN` (garde
      # anti-récursion). Or c'est exactement le chemin d'une PR ouverte par
      # `auto-pr.yml` : il dispatche ce workflow, ce workflow passe au vert…
      # et `automerge.yml`, qui n'écoute que `workflow_run`, ne se réveille
      # jamais. #231 est restée ouverte avec ses trois check runs VERTS ; un
      # simple `gh workflow run automerge.yml` l'a mergée en quinze secondes.
      # Les runs `pull_request` de la même PR étaient en `action_required` — la
      # garde « Approve and run » que GitHub pose sur les PR du bot — donc ce
      # chemin-là ne réveillait rien non plus.
      #
      # La condition `workflow_dispatch` est ce qui rend ce filet quasi gratuit.
      # Sans elle, CHAQUE run de ce workflow (pushes sur main, événements de PR)
      # ajouterait un run d'automerge — or sur un dépôt PRIVÉ chaque job est
      # facturé à la minute entamée, et le plan gratuit n'en donne que 2 000 par
      # mois. Sur le chemin normal `pull_request`, `workflow_run` fonctionne
      # déjà : il n'y a rien à réveiller. On ne paie donc que le cas qui casse,
      # soit une poussée de nouvelle branche.
      - name: Réveiller automerge (chemin dispatché seulement)
        if: always() && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          if gh workflow run automerge.yml --ref main; then
            echo "automerge.yml réveillé."
          else
            echo "::warning title=Réveil impossible::automerge.yml n'a pas pu être dispatché ; la PR restera ouverte jusqu'au filet horaire d'automerge."
          fi
