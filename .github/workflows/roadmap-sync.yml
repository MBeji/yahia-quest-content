name: Roadmap sync

# ⚠️ DEPUIS LE 2026-09-23, LA ROADMAP N'EST PLUS ICI : elle est fusionnée dans `STATUS.md` §6
# du moteur (public), un seul document pour l'état et le reste-à-faire. Ce workflow garde
# son rôle — le cron et les deux issues — et lit `engine/STATUS.md`. Le récit qui suit dit
# pourquoi le gate existe ; il date de l'époque où la roadmap vivait ici.
#
# La ROADMAP était ici (privé), les lots se livrent dans le dépôt public : aucune PR
# ne touche les deux, donc sa règle d'origine — « cocher la case dans la même PR
# que le lot » — est inapplicable depuis la scission (étude 24). Elle a dérivé de
# 24 lots en cinq jours, du 2026-07-20 au 2026-07-25.
#
# Le gate vit dans le MOTEUR (public, testé là-bas) et c'est ce workflow qui
# l'appelle avec le chemin du corpus — même schéma que les gates de contenu :
# les gates suivent leurs données.
#
# ⚠️ DEUX GATES DEPUIS LE 2026-09-12, et ils ne regardent pas la même chose :
#   • `check-roadmap-sync.mjs` — la roadmap CONNAÎT-elle les lots livrés au moteur ?
#   • `check-etudes-index.mjs` — l'index, l'en-tête de chaque `ETUDE.md`, le rangement
#     dans `EtudeRealisé/` et `STATUS.md` §4 se CONTREDISENT-ils ? (arena#994)
# Chacun tient sa propre issue, sous son propre libellé, et se referme tout seul.
# Le second a trouvé SIX écarts à sa première exécution, dont un lot d'étude déclaré
# fini avec un de ses trois livrables manquant (é26 lot 2 : les gels Q-3 n'étaient
# actés nulle part, et trois documents affirmaient trois choses différentes).
#
# ⚠️ Le `name:` de ce workflow ne bouge pas : `automerge.yml` l'attend sous « Roadmap
# sync » dans son `workflow_run`. Le renommer suspendrait la chaîne de merge.
#
# Deux déclencheurs, deux rôles :
#   • `schedule` — le vrai filet. La dérive vient d'en face, pas d'ici : ce dépôt
#     peut rester silencieux des jours pendant que `main` avance (c'est très
#     exactement ce qui s'est produit). Un déclencheur sur PR seul ne l'aurait
#     jamais vue.
#   • `pull_request` sur la roadmap — valide l'édition au moment où on la fait.
#
# ⚠️ UN CRON ROUGE N'ATTEINT PERSONNE — et ce workflow l'a prouvé sur lui-même.
# Le 2026-08-16, il échouait sur `main` depuis TROIS nuits (08-14, 08-15, 08-16) :
# trois lots du moteur n'étaient cités nulle part, dont arena#743 et arena#746, qui
# font passer l'étude 02 en exécution pendant que le §6 disait encore « é02 se
# re-scope maintenant ». Le gate avait raison, il le répétait chaque nuit, et il le
# répétait à un onglet que personne n'ouvre. Il aura fallu qu'une session vienne
# débloquer une PR sans rapport pour que quelqu'un le lise.
#
# C'est la leçon F10 mot pour mot — « ce qui manque n'est jamais la garde, c'est
# que sa panne n'atteint personne » — donc on l'applique ici, comme
# `content-drift.yml` et `video-health.yml` l'appliquent déjà :
#   • `pull_request` → le **check rouge** suffit : il est sous les yeux de la
#     session qui édite la roadmap, à l'instant où elle l'édite ;
#   • `schedule` / `workflow_dispatch` → une **issue** tenue à jour et refermée
#     d'elle-même. Une issue ouverte survit à l'onglet Actions ; un run rouge non.
#     Le run reste vert dans ce cas, délibérément : un rouge permanent est
#     exactement ce qu'on apprend à ignorer — c'est ce qui vient de se produire.

on:
  pull_request:
    types: [synchronize, reopened]
    # ⚠️ `opened` volontairement absent — même raison que `content-ci.yml` (étude 32,
    # lot 1). Le récit complet y est ; ici c'est le même fantôme, sur le même SHA.
    paths:
      # Tout le dossier : le gate d'index lit l'index, les en-têtes de chaque
      # `ETUDE.md` et leur rangement — un statut dérive par n'importe lequel.
      - "FableEtudes/**"
  schedule:
    # 05:30 UTC — après le nightly du dépôt public (04:14), donc sur un `main` du jour.
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  # Ouvrir, commenter et refermer l'issue de suivi (chemin `schedule`). C'est une portée
  # à part entière : un bloc `permissions:` explicite REMPLACE le défaut du dépôt, il ne
  # s'y ajoute pas — sans cette ligne `gh issue` répondrait `403 Resource not accessible
  # by integration`, la panne qui avait tué la chaîne d'automerge le 2026-07-26.
  issues: write

concurrency:
  group: roadmap-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    name: la roadmap connaît-elle les lots déjà livrés ?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout corpus (ce repo)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: corpus

      - name: Checkout moteur (repo public)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: MBeji/yahia-quest-arena
          path: engine
          # Le gate lit `git log` : un clone superficiel ne verrait qu'un commit
          # et déclarerait la roadmap saine quoi qu'il arrive.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      # Aucun `npm ci` : le gate n'utilise que des modules natifs de Node.
      - name: roadmap-sync
        id: sync
        working-directory: engine
        # Ne doit PAS tuer le job : sur `schedule`, tout le travail utile — ouvrir ou
        # refermer l'issue — vient après. Le verdict est rétabli en dernière étape pour
        # les PR. `code` est écrit AVANT le `exit`, donc l'output survit à l'échec.
        continue-on-error: true
        run: |
          set -uo pipefail
          code=0
          node scripts/ci/check-roadmap-sync.mjs \
            --ref HEAD \
            --roadmap STATUS.md \
            > "$GITHUB_WORKSPACE/roadmap-sync.txt" 2>&1 || code=$?
          cat "$GITHUB_WORKSPACE/roadmap-sync.txt"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Rapport
        id: report
        run: |
          set -euo pipefail
          cat "$GITHUB_WORKSPACE/roadmap-sync.txt" >> "$GITHUB_STEP_SUMMARY"
          {
            echo "body<<ROADMAPSYNCEOF"
            cat "$GITHUB_WORKSPACE/roadmap-sync.txt"
            echo "ROADMAPSYNCEOF"
          } >> "$GITHUB_OUTPUT"

      - name: etudes-index
        id: etudes
        working-directory: engine
        # Même contrat que l'étape précédente : ne tue pas le job (le travail utile
        # vient après), verdict rétabli en fin de workflow pour les PR.
        continue-on-error: true
        run: |
          set -uo pipefail
          code=0
          node scripts/ci/check-etudes-index.mjs \
            --etudes "$GITHUB_WORKSPACE/corpus/FableEtudes" \
            --status STATUS.md \
            > "$GITHUB_WORKSPACE/etudes-index.txt" 2>&1 || code=$?
          cat "$GITHUB_WORKSPACE/etudes-index.txt"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Rapport (index des études)
        id: report-etudes
        run: |
          set -euo pipefail
          cat "$GITHUB_WORKSPACE/etudes-index.txt" >> "$GITHUB_STEP_SUMMARY"
          {
            echo "body<<ETUDESINDEXEOF"
            cat "$GITHUB_WORKSPACE/etudes-index.txt"
            echo "ETUDESINDEXEOF"
          } >> "$GITHUB_OUTPUT"

      - name: Ouvrir ou mettre à jour l'issue des contradictions
        if: github.event_name != 'pull_request' && steps.etudes.outputs.code != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REPORT: ${{ steps.report-etudes.outputs.body }}
        run: |
          set -euo pipefail
          gh label create doc-drift \
            --color FBCA04 \
            --description "Index, en-têtes d'études et STATUS.md se contredisent (gate etudes:check)" \
            --force
          # Heredoc indenté au niveau du bloc YAML — un `---` en colonne 0 dans le
          # FICHIER serait lu par YAML comme un second document (même piège qu'au-dessus).
          FOOTER="$(cat <<'MDEOF'

          ---

          **Quoi faire.** Trancher chaque ligne en relisant, puis aligner le document qui a
          tort. La source de vérité est l'**en-tête du `ETUDE.md`** (§ Cycle de vie de
          l'index) — mais elle peut être la périmée des trois : é11 a annoncé « 6 lots sur 8 »
          et « `tutor_digests` n'existe nulle part » dix-neuf jours après le merge de ces
          deux lots. Un statut d'étude se **constate** sur `main`, il ne se recopie pas.

          ⚠️ Le gate a un avis sur la **contradiction**, jamais sur l'exhaustivité : un
          document qui ne parle pas d'une étude ne le fait pas rougir. C'est la limite posée
          par arena#994, et elle est délibérée — un gate qui exigerait une mention à chaque
          PR transformerait le topo en journal.

          Cette issue se referme **d'elle-même** au passage suivant du cron (05:30 UTC).
          MDEOF
          )"
          BODY="$(printf '```\n%s\n```\n' "$REPORT")$FOOTER"
          EXISTING="$(gh issue list --label doc-drift --state open --limit 1 --json number --jq '.[0].number')"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
            echo "Issue #$EXISTING mise à jour."
          else
            gh issue create --title "Les documents d'étude se contredisent" \
              --label doc-drift --body "$BODY"
          fi

      - name: Refermer l'issue quand les documents s'accordent
        if: github.event_name != 'pull_request' && steps.etudes.outputs.code == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          EXISTING="$(gh issue list --label doc-drift --state open --limit 1 --json number --jq '.[0].number')"
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" \
              --comment "Index, en-têtes, rangement et STATUS.md §4 s'accordent de nouveau — clôture automatique."
            echo "Issue #$EXISTING refermée."
          else
            echo "Rien à refermer : les documents s'accordent."
          fi

      - name: Ouvrir ou mettre à jour l'issue de suivi
        if: github.event_name != 'pull_request' && steps.sync.outputs.code != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REPORT: ${{ steps.report.outputs.body }}
        run: |
          set -euo pipefail
          gh label create roadmap-drift \
            --color D4C5F9 \
            --description "La roadmap ignore des lots déjà livrés au moteur (gate roadmap-sync)" \
            --force
          # ⚠️ Le corps du heredoc est indenté au niveau du bloc YAML, et ce n'est pas
          # cosmétique : YAML retire l'indentation commune, donc ces lignes retombent en
          # colonne 0 dans le script — mais laissées en colonne 0 DANS LE FICHIER, le
          # `---` du séparateur Markdown serait lu par YAML comme un début de second
          # document et casserait le workflow entier. (`<<-` ne remplace pas cette
          # indentation : il ne retire que les tabulations, pas les espaces.)
          FOOTER="$(cat <<'MDEOF'

          ---

          **Quoi faire.** Citer chaque PR ci-dessus dans `STATUS.md` du moteur (feuille de route
          §6, ou une ligne au journal §9) — livrée, reportée ou sans objet : le gate a un avis
          sur la **connaissance**, jamais sur le statut. Le marqueur d'en-tête
          `<!-- roadmap-sync: since-pr=N -->` ne se déplace qu'après avoir cité tout ce qu'il saute.

          ⚠️ Un lot cité « hors file » mérite quand même une lecture : c'est ainsi qu'une étude
          passée en exécution au moteur peut laisser derrière elle une ligne de roadmap qui la
          dit encore à ouvrir.

          Cette issue se referme **d'elle-même** au passage suivant du cron (05:30 UTC).
          MDEOF
          )"
          # Le rapport part dans un bloc de code : il garde son alignement, et surtout
          # il ne colle pas au `---` du séparateur — un `---` collé à une ligne de texte
          # est un soulignement setext, qui transformerait la dernière ligne du rapport
          # en titre de niveau 2.
          BODY="$(printf '```\n%s\n```\n' "$REPORT")$FOOTER"
          EXISTING="$(gh issue list --label roadmap-drift --state open --limit 1 --json number --jq '.[0].number')"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
            echo "Issue #$EXISTING mise à jour."
          else
            gh issue create --title "La roadmap ignore des lots déjà livrés" \
              --label roadmap-drift --body "$BODY"
          fi

      - name: Refermer l'issue quand la roadmap a rattrapé
        if: github.event_name != 'pull_request' && steps.sync.outputs.code == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          EXISTING="$(gh issue list --label roadmap-drift --state open --limit 1 --json number --jq '.[0].number')"
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" \
              --comment "Chaque lot livré au moteur est de nouveau cité dans la roadmap — clôture automatique."
            echo "Issue #$EXISTING refermée."
          else
            echo "Rien à refermer : la roadmap connaît tout ce qui est livré."
          fi

      # Sur une PR, l'issue n'a pas lieu d'être : le check rouge EST le canal, et il
      # arrive à quelqu'un. `continue-on-error` ayant neutralisé l'étape du gate, on
      # rétablit son verdict ici.
      - name: Sur une PR, un écart doit rougir le check
        if: github.event_name == 'pull_request' && steps.sync.outputs.code != '0'
        run: |
          echo "::error title=Roadmap en retard::La roadmap ignore des lots déjà livrés au moteur — rapport dans l'étape « roadmap-sync » et dans le résumé du run."
          exit 1

      - name: Sur une PR, une contradiction doit rougir le check
        if: github.event_name == 'pull_request' && steps.etudes.outputs.code != '0'
        run: |
          echo "::error title=Documents d'étude en contradiction::Index, en-tête d'ETUDE.md, rangement ou STATUS.md §4 se contredisent — rapport dans l'étape « etudes-index » et dans le résumé du run."
          exit 1
