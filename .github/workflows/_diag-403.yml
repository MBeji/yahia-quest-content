name: Diag 403 (jetable)

# Workflow de diagnostic JETABLE — à supprimer avant la PR de correctif.
# Répétition à blanc du script corrigé d'automerge.yml, avec SON bloc `permissions:` corrigé :
# tout est exécuté sauf le `gh pr merge` final. But : prouver que la chaîne va au bout AVANT de
# poser le correctif sur main (un job `workflow_run` s'exécute toujours depuis la branche par
# défaut — le correctif ne peut donc pas se valider sur sa propre PR).

on:
  push:
    branches: ['wip/diag-automerge-403']

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  repetition:
    name: Script corrigé, à blanc
    runs-on: ubuntu-latest
    steps:
      - name: Merger la PR si tout est vert (À BLANC)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
          INPUT_PR: ''
          SELF_CHECK: automerge
        run: |
          set -euo pipefail

          # 1) Quelle PR porte ce commit ?
          if [ -n "${INPUT_PR:-}" ]; then
            pr="$INPUT_PR"
            sha="$(gh pr view "$pr" --json headRefOid --jq .headRefOid)"
          else
            sha="$HEAD_SHA"
            pr="$(gh api "repos/$REPO/commits/$sha/pulls" \
                    --jq '[.[] | select(.state == "open")][0].number // empty')"
          fi
          if [ -z "${pr:-}" ]; then
            echo "Aucune PR ouverte ne porte $sha — rien à faire."; exit 0
          fi
          echo "PR #$pr, tête $sha"

          # 2) Les opt-out (affectation séparée du `read`, comme dans le correctif).
          meta="$(gh pr view "$pr" \
            --json isDraft,headRefName,baseRefName \
            --jq '[.isDraft, .headRefName, .baseRefName] | @tsv')"
          read -r draft branch base <<<"$meta"
          opted_out="$(gh pr view "$pr" --json labels \
            --jq 'any(.labels[]; .name == "no-automerge")')"
          echo "  etape 2 OK : draft=$draft branch=$branch base=$base opted_out=$opted_out"
          # A blanc : on NE sort PAS sur les opt-out, sinon le prefixe `wip/` couperait le test.

          # 3) L'étape qui 403ait : tous les check runs du SHA.
          runs="$(gh api "repos/$REPO/commits/$sha/check-runs" --paginate \
                    --jq ".check_runs[] | select(.name != \"$SELF_CHECK\") | \"\(.name)|\(.status)|\(.conclusion // \"\")\"")"
          echo "  etape 3 OK : check runs lus"
          echo "$runs" | sed 's/^/    /'
          pending="$(echo "$runs" | awk -F'|' '$2 != "completed"' | wc -l)"
          red="$(echo "$runs" | awk -F'|' '$3 != "success" && $3 != "skipped" && $3 != "neutral"' || true)"
          echo "  pending=$pending rouges=$(printf '%s' "$red" | grep -c . || true)"

          # 4) Mergeable + le chemin de conflit (label), sur CETTE PR jetable.
          state=""
          for _ in 1 2 3 4 5 6; do
            state="$(gh pr view "$pr" --json mergeable --jq .mergeable)"
            [ "$state" = "UNKNOWN" ] || break
            sleep 5
          done
          echo "  etape 4 OK : mergeable=$state"
          echo "  --- chemin de conflit : label needs-rebase (sans permission issues:) ---"
          gh label create needs-rebase --color D93F0B \
            --description "PR en conflit avec main — à rebaser par sa session" --force
          echo "    gh label create OK"
          gh pr edit "$pr" --add-label needs-rebase
          echo "    gh pr edit --add-label OK"
          gh pr edit "$pr" --remove-label needs-rebase
          echo "    (label retire — PR jetable)"

          # 5) Merge : NON exécuté à blanc.
          echo "  etape 5 : [A BLANC] gh pr merge $pr --squash --delete-branch non execute."
