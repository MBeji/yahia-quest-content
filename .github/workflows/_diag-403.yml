name: Diag 403 (jetable)

# Workflow de diagnostic JETABLE — à supprimer avant la PR de correctif.
# But : établir expérimentalement quelles lectures `gh` sont refusées à
# GITHUB_TOKEN sur ce dépôt privé, sous le bloc `permissions:` d'automerge.yml
# (contents+pull-requests) puis avec `checks: read` ajouté.

on:
  push:
    branches: ['wip/diag-automerge-403']

jobs:
  actuel:
    name: Permissions actuelles d'automerge.yml
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Sonder
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REPO: ${{ github.repository }}
          PR: '22'
          SHA: bbeaed9b7117c66fa4489d825d3b38fa6a3a0439
        run: |
          set -uo pipefail
          p() {
            printf -- '--- %s\n' "$1"
            if out="$(bash -c "$2" 2>&1)"; then
              printf '    OK   : %s\n' "${out:0:200}"
            else
              printf '    FAIL : %s\n' "${out:0:200}"
            fi
          }
          p "REST  commits/:sha/pulls (etape 1)"      'gh api "repos/$REPO/commits/$SHA/pulls" --jq "[.[] | select(.state == \"open\")][0].number // empty"'
          p "REST  commits/:sha/check-runs (etape 3)" 'gh api "repos/$REPO/commits/$SHA/check-runs" --paginate --jq ".check_runs[] | \"\(.name)|\(.status)|\(.conclusion // \"\")\""'
          p "REST  commits/:sha/check-runs sans jq"   'gh api "repos/$REPO/commits/$SHA/check-runs" --jq .total_count'
          p "REST  commits/:sha/status"               'gh api "repos/$REPO/commits/$SHA/status" --jq .state'
          p "GQL   statusCheckRollup"                 'gh pr view "$PR" --json statusCheckRollup --jq "[.statusCheckRollup[] | \"\(.name)|\(.status)|\(.conclusion)\"] | join(\" ~ \")"'

  avec_checks:
    name: Idem + checks read
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: read
    steps:
      - name: Sonder
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REPO: ${{ github.repository }}
          PR: '22'
          SHA: bbeaed9b7117c66fa4489d825d3b38fa6a3a0439
        run: |
          set -uo pipefail
          p() {
            printf -- '--- %s\n' "$1"
            if out="$(bash -c "$2" 2>&1)"; then
              printf '    OK   : %s\n' "${out:0:200}"
            else
              printf '    FAIL : %s\n' "${out:0:200}"
            fi
          }
          p "REST  commits/:sha/check-runs (etape 3)" 'gh api "repos/$REPO/commits/$SHA/check-runs" --paginate --jq ".check_runs[] | \"\(.name)|\(.status)|\(.conclusion // \"\")\""'
          p "GQL   statusCheckRollup"                 'gh pr view "$PR" --json statusCheckRollup --jq "[.statusCheckRollup[] | \"\(.name)|\(.status)|\(.conclusion)\"] | join(\" ~ \")"'
