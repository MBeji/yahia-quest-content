name: Pin check

# Rend l'épinglage des Actions auto-portant — le pendant, côté corpus privé, du
# gate harness du moteur (MBeji/yahia-quest-arena, PR #568). Toute Action de
# .github/workflows/** doit être clouée à un SHA de commit de 40 hex ; un `@vN`,
# un `@branch` ou un tag mobile fait échouer ce job. Le moteur est un script
# d'arena qui ne franchit pas la frontière de ce repo, d'où ce gate autonome.
#
# Ce workflow se vérifie lui-même (son propre checkout est épinglé ci-dessous).

on:
  pull_request:
  push:
    branches: [main]
  # Même raison que dans content-ci.yml : `auto-pr.yml` dispatche ce workflow
  # sur la branche, parce qu'une PR ouverte par le GITHUB_TOKEN n'émet pas
  # d'événement `pull_request` et n'aurait donc aucun check.
  workflow_dispatch:

permissions:
  contents: read
  # Réveiller `automerge.yml` en fin de course — voir la dernière étape. Le bloc
  # `permissions:` REMPLACE le défaut du dépôt : une portée non listée tombe à
  # `none`, pas à `read`.
  actions: write

jobs:
  pinned:
    name: Actions épinglées au SHA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Vérifier l'épinglage
        run: |
          set -euo pipefail
          # Lignes `uses:` qui ne sont NI une action locale (`./…`) NI épinglées à
          # un SHA de 40 hex. `docker://…@sha256:` serait à exclure ici s'il apparaissait.
          # Ancré en début de ligne : ne matche que les VRAIES clés YAML `uses:`
          # (`  uses:` / `  - uses:`), jamais une mention de « uses: » dans un
          # commentaire ou une string (sinon ce fichier se ferait échouer lui-même).
          bad="$(grep -rnE '^[[:space:]]*-?[[:space:]]*uses:[[:space:]]' .github/workflows/ \
                 | grep -vE 'uses:[[:space:]]*\./' \
                 | grep -vE '@[0-9a-f]{40}([[:space:]]|$)' || true)"
          if [ -n "$bad" ]; then
            echo "::error::Action(s) non épinglée(s) au SHA (politique arena #568) :"
            printf '%s\n' "$bad"
            echo "Épingler chaque action à un SHA : uses: owner/repo@<sha40> # vN"
            exit 1
          fi
          echo "OK — toutes les Actions de .github/workflows/** sont épinglées au SHA."

      # Même filet que dans content-ci.yml, et même condition : voir le
      # commentaire détaillé là-bas et l'en-tête de automerge.yml. En deux mots :
      # GitHub n'émet pas de `workflow_run` pour un run déclenché par le
      # GITHUB_TOKEN, donc une PR ouverte par auto-pr.yml devient verte sans que
      # rien ne réveille automerge (PR #231, restée ouverte avec ses trois checks
      # au vert). La condition `workflow_dispatch` limite le coût au seul chemin
      # qui casse — sur un dépôt privé, chaque job est facturé à la minute
      # entamée.
      - name: Réveiller automerge (chemin dispatché seulement)
        if: always() && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          if gh workflow run automerge.yml --ref main; then
            echo "automerge.yml réveillé."
          else
            echo "::warning title=Réveil impossible::automerge.yml n'a pas pu être dispatché ; la PR restera ouverte jusqu'au prochain push sur main."
          fi
