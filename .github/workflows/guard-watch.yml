name: Garde des gardes (un rouge programmé se voit)

# Une garde programmée qui rougit sans que personne ne le sache n'est pas une
# garde. Ce workflow regarde périodiquement les runs des AUTRES workflows et
# ouvre une issue dès qu'un échec traîne.
#
# POURQUOI, ET CE QUE ÇA A COÛTÉ AILLEURS — le 2026-08-24, l'audit du dépôt
# moteur a trouvé `report-triage.yml` en échec 6×/jour DEPUIS 26 JOURS (~150
# runs, autant de journées de signalements utilisateurs non triés). Le workflow
# criait correctement : `::error::` nommait le secret fautif à chaque run. Mais
# « crier » dans l'onglet Actions ne parle qu'à celui qui l'ouvre, et personne
# ne l'ouvrait. Il n'a été trouvé que par un audit fortuit.
#
# POURQUOI UNE GARDE EXTERNE PLUTÔT QU'UN `if: failure()` DANS CHACUNE — quatre
# des cinq gardes programmées d'ici (content-drift, video-health, roadmap-sync,
# manuel-health) savent ouvrir une issue pour ce qu'elles CONSTATENT, mais
# aucune n'a de filet pour son propre PLANTAGE : leur machinerie d'issue vit
# après les étapes qui peuvent mourir. Un filet par workflow serait quatre
# rustines à maintenir, et il resterait aveugle aux pannes qui tuent le job
# avant toute étape — YAML invalide, checkout du moteur qui échoue, `npm ci`
# cassé, job annulé, runner perdu. Une garde EXTERNE voit tout ça, et voit
# aussi les workflows qui n'existent pas encore : rien à câbler quand on en
# ajoute un.
#
# CE QU'ELLE NE FAIT PAS : juger. Elle ne relance rien, ne corrige rien, ne
# décide rien. Elle rend un rouge VISIBLE, et se tait dès qu'il n'y en a plus.

on:
  schedule:
    # Toutes les 6 h, à une minute décalée pour ne pas rentrer dans le pic
    # d'ordonnancement de GitHub (où les crons ronds partent avec du retard).
    - cron: "47 */6 * * *"
  workflow_dispatch:

concurrency:
  group: guard-watch
  cancel-in-progress: false

permissions:
  contents: read
  # Ouvrir, mettre à jour et refermer l'issue de suivi.
  issues: write
  # Lire les runs des autres workflows.
  actions: read

jobs:
  watch:
    name: un workflow est-il rouge sans que personne ne le sache ?
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # `gh` tourne sans checkout : sans ça il échoue sur « not a git
      # repository » (piège déjà payé par automerge.yml le 2026-07-25).
      GH_REPO: ${{ github.repository }}
      LABEL: garde-rouge
      # Fenêtre d'observation. Plus large que le cron À DESSEIN : deux passages
      # se recouvrent, donc un échec ne peut pas se glisser entre deux fenêtres.
      # Le recouvrement ne produit pas de doublon — une seule issue est réutilisée.
      WINDOW_HOURS: "8"
    steps:
      - name: Checkout du moteur (la décision y vit, partagée)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: MBeji/yahia-quest-arena
          path: engine
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Relever les runs rouges de la fenêtre
        id: scan
        run: |
          set -euo pipefail

          # Borne basse calculée par `date` : pas d'arithmétique de dates en shell.
          since="$(date -u -d "-${WINDOW_HOURS} hours" +%Y-%m-%dT%H:%M:%SZ)"
          echo "Fenêtre : depuis $since (UTC)."

          # Filtrage SERVEUR (`--created`, `--status`), jamais en local après un `--limit` :
          # mesuré le 2026-08-24 sur le dépôt moteur, les 100 runs les plus récents ne
          # couvraient qu'1 h 13. Ce dépôt-ci est moins actif, donc le bug y dormait — il se
          # serait réveillé le jour d'une grosse campagne, c'est-à-dire le jour où la garde
          # compte. Une garde qui se trompe en silence est pire que pas de garde.
          #
          # Ce workflow ne s'exclut PAS de son propre scan : un run qui meurt ne rapporte rien,
          # l'exclure ne protégerait de rien et le rendrait aveugle à ses propres pannes.
          fields=databaseId,workflowName,conclusion,createdAt,event,url
          gh run list --created ">=$since" --status failure   --limit 200 --json "$fields" > rouges.json
          gh run list --created ">=$since" --status timed_out --limit 200 --json "$fields" > lents.json
          jq -s 'add' rouges.json lents.json > runs.json

          # UN RUN À ZÉRO JOB N'A RIEN ÉVALUÉ — il ne peut donc pas avoir échoué. C'était la
          # signature des `pull_request` mort-nés de ce dépôt, et les compter a produit une
          # alarme entièrement fausse (#293, « 37 run(s) rouge(s) », qui orientait son lecteur
          # vers un secret alors que rien n'était cassé). Depuis l'étude 32 lot 1 la CAUSE est
          # supprimée — `opened` a quitté les déclencheurs et `harness:check --corpus` fait
          # échouer la CI s'il revient — donc cette sonde ne devrait plus rien écarter. Elle
          # reste : elle coûte un appel d'API par rouge, et c'est ce qui fait que l'alarme dira
          # encore vrai le jour où quelqu'un remettra `opened`.
          #
          # ⚠️ POLARITÉ, et elle est l'INVERSE de celle d'`auto-pr.yml` : là-bas, à mesure
          # douteuse on dispatche ; ici, à mesure douteuse on GARDE le rouge. On construit donc
          # la liste de ce qu'on ÉCARTE, jamais de ce qu'on garde — si quoi que ce soit tourne
          # mal, elle reste vide et l'alarme part entière. Une garde se trompe en criant.
          #
          # Le passage par un fichier plutôt qu'un heredoc : un heredoc bash colle son
          # délimiteur en colonne 0, ce qui SORT du scalaire YAML — le workflow ne se parse
          # alors même plus.
          liste="$RUNNER_TEMP/garde-runs.txt"
          jq -r '.[] | "\(.databaseId) \(.conclusion)"' runs.json > "$liste"
          drop=""
          while read -r id concl; do
            [ -n "${id:-}" ] || continue
            # On ne pose la question qu'aux `failure` : un `timed_out` a tourné, par définition.
            [ "${concl:-}" = "failure" ] || continue
            jobs="$(gh api "repos/$GH_REPO/actions/runs/$id/jobs" --jq '.total_count' 2>/dev/null || echo 1)"
            case "${jobs:-1}" in ''|*[!0-9]*) jobs=1 ;; esac
            [ "$jobs" -eq 0 ] || continue
            echo "  run $id écarté — zéro job, il n'a rien évalué (#297)."
            drop="$drop $id"
          done < "$liste"

          # QUI compte comme un rouge, et COMMENT il se raconte : `scripts/ci/guard-watch.mjs`
          # du moteur, partagé avec lui (étude 32, L3b) et couvert par 18 tests. Ce dépôt GARDE
          # les échecs de `pull_request` — contrairement au moteur : ici aucun check n'est
          # requis (dépôt privé, compte Free, rulesets en 403), donc une PR rouge ne bloque
          # rien d'ostensible ; elle dort, et c'est le silence que cette garde rompt.
          count="$(node engine/scripts/ci/guard-watch.mjs \
            --runs runs.json --out corps.md \
            --since "$since" --window-hours "$WINDOW_HOURS" \
            --include-pull-request --drop-ids "$drop")"

          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Rouges dans la fenêtre : $count"

      - name: Ouvrir ou mettre à jour l'issue
        if: steps.scan.outputs.count != '0'
        run: |
          set -euo pipefail
          gh label create "$LABEL" --color b60205 \
            --description "Une garde programmée est en échec" 2>/dev/null || true

          titre="🚨 Gardes en échec (${{ steps.scan.outputs.count }} run(s) rouge(s))"
          existing="$(gh issue list --label "$LABEL" --state open --limit 1 --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --title "$titre" --body-file corps.md >/dev/null
            echo "Issue #$existing mise à jour."
          else
            gh issue create --title "$titre" --label "$LABEL" --body-file corps.md
          fi

      - name: Refermer l'issue quand la fenêtre est redevenue verte
        if: steps.scan.outputs.count == '0'
        run: |
          set -euo pipefail
          existing="$(gh issue list --label "$LABEL" --state open --limit 1 --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue close "$existing" \
              --comment "✅ Plus aucun run rouge sur les ${WINDOW_HOURS} dernières heures — fermeture automatique." >/dev/null
            echo "Issue #$existing refermée."
          else
            echo "Rien à refermer : aucune garde en échec."
          fi
