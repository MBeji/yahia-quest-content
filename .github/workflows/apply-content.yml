name: Apply content (PROD)

# Applique le corpus (sql/content/<subject>.sql) à la base de PRODUCTION.
#
# Pourquoi ce workflow existe (étude 24 D-3) : une base Postgres n'héberge qu'UN
# historique de migrations, donc deux dépôts qui poussent dessus se bloquent
# mutuellement (« Remote migration versions not found in local migrations
# directory »). Le corpus quitte donc le framework de migrations : il devient des
# fichiers par sujet à nom stable, appliqués ici par psql. C'est le pendant privé
# de `db-migrate-prod.yml`, avec la même posture de sûreté (garde de cible +
# pg_dump préalable + journal).
#
# ⚠️ DÉSARMÉ — lot 3a. `workflow_dispatch` UNIQUEMENT : aucun merge, aucun push
# ne peut déclencher une application en production. Le déclencheur automatique
# (push sur main touchant content/**) ne sera armé qu'au lot 3b, APRÈS la
# répétition intégrale sur le projet TEST et l'arbitrage du runbook §4.3.
# Tant que cette ligne est là, ce fichier est du code livré, pas une automation
# active.
#
# Prérequis : secret PROD_SUPABASE_DB_URL (même valeur que dans le repo public)
# et la table `content_releases` (migration du repo public, appliquée au merge).

on:
  workflow_dispatch:
    inputs:
      subjects:
        description: "ids de sujets séparés par des espaces (vide = tout le corpus — sûr, l'application est idempotente)"
        type: string
        default: ""
      dry_run:
        description: "n'applique rien : affiche le plan et sort (défaut = true)"
        type: boolean
        default: true

# Jamais deux applications de contenu en parallèle sur la même base.
concurrency:
  group: apply-content-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply:
    name: Apply content to PROD
    runs-on: ubuntu-latest
    # 120 et non 30 (releve le 2026-07-20). Mesure reelle sur le projet TEST :
    # 52 sujets sur 77 appliques en 30 min, soit ~45 min pour le corpus complet.
    # A 30 min, une application integrale est COUPEE EN PLEIN MILIEU par GitHub
    # (statut `cancelled`, pas `failure`) : les sujets deja passes sont appliques,
    # les suivants non, et l'ecriture dans `content_releases` — qui est en fin de
    # job — n'a pas lieu. On perd donc la trace de ce qui a ete applique.
    # Une application incrementale (quelques sujets) reste bien en-deca.
    timeout-minutes: 120
    env:
      PROD_SUPABASE_DB_URL: ${{ secrets.PROD_SUPABASE_DB_URL }}
      DRY_RUN: ${{ github.event.inputs.dry_run }}
      SUBJECTS: ${{ github.event.inputs.subjects }}
      # Ref du projet prod — miroir de la garde `assertProdDbUrl` du moteur
      # (scripts/db/push-prod.mjs). Non secret : déjà en clair dans le repo public.
      PROD_REF: fasrenmmrkqjoobrztbp
      TEST_REF: pqegdnwdtbjtplcthxyp

    steps:
      - name: Garde — secret présent
        run: |
          if [ -z "${PROD_SUPABASE_DB_URL}" ]; then
            echo "::error::Secret PROD_SUPABASE_DB_URL manquant (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      # Fail closed : on refuse de tourner si l'URL ne désigne pas sans ambiguïté
      # la PROD. Même logique que `assertProdDbUrl` côté moteur.
      - name: Garde — la cible est bien la PROD
        run: |
          set -euo pipefail
          case "${PROD_SUPABASE_DB_URL}" in
            *"${TEST_REF}"*)
              echo "::error::L'URL vise le projet TEST (${TEST_REF}) — refus."; exit 1 ;;
          esac
          case "${PROD_SUPABASE_DB_URL}" in
            *"${PROD_REF}"*) echo "Cible confirmée : prod (${PROD_REF})." ;;
            *) echo "::error::L'URL ne contient pas le ref prod connu (${PROD_REF}) — refus."; exit 1 ;;
          esac

      # Un runner GitHub n'a pas d'IPv6, et l'hôte direct `db.<ref>.supabase.co`
      # n'est servi qu'en IPv6 (sauf add-on IPv4 — que ce projet n'a pas). Une URL
      # directe passe les deux gardes ci-dessus, puis meurt 90 s plus tard dans le
      # pg_dump sur un « Network is unreachable » qui ne dit pas quoi faire.
      # Vécu les 2026-07-27 et 2026-07-28 : le canal n'avait jamais rien appliqué
      # depuis la scission, et ça ressemblait à un workflow rouge sans cause.
      - name: Garde — l'URL doit être celle du pooler (IPv4)
        run: |
          set -euo pipefail
          case "${PROD_SUPABASE_DB_URL}" in
            *"@db."*)
              echo "::error::PROD_SUPABASE_DB_URL est une « Direct connection » (@db.<ref>.supabase.co) : servie en IPv6 seule, injoignable depuis un runner GitHub. Reprendre l'URI « Session pooler » (port 5432) dans Supabase > Connect. Deux pièges qui coûtent chacun un run : l'utilisateur doit être postgres.<ref> (et non postgres), et tout caractère spécial du mot de passe doit être percent-encodé. Détail : docs/backup-restore-runbook.md du dépôt public."
              exit 1 ;;
          esac
          case "${PROD_SUPABASE_DB_URL}" in
            *pooler.supabase.com*) echo "URL pooler confirmée (IPv4)." ;;
            *) echo "::warning::Hôte ni direct ni pooler — inattendu. On tente." ;;
          esac
          # Le pooler expose DEUX ports et l'interface propose les deux onglets :
          # 6543 = mode transaction (pas de prepared statements, pg_dump non
          # supporté), 5432 = mode session, le seul qui convienne ici. Vécu le
          # 2026-07-29 : URL en 6543, échec sur le pg_dump.
          case "${PROD_SUPABASE_DB_URL}" in
            *pooler.supabase.com:6543*)
              echo "::error::URL en port 6543 = pooler en mode TRANSACTION : pg_dump n'y est pas supporté. Prendre l'onglet « Session pooler » (port 5432) dans Supabase > Connect."
              exit 1 ;;
          esac
          # Le pooler exige un identifiant de tenant : l'utilisateur doit être
          # postgres.<ref>, pas postgres. Sans le suffixe, l'échec se présente
          # comme un mot de passe faux (le pooler retire le suffixe avant l'auth),
          # ce qui envoie chercher au mauvais endroit.
          case "${PROD_SUPABASE_DB_URL}" in
            *"//postgres.${PROD_REF}:"*) echo "Tenant confirmé : postgres.${PROD_REF}." ;;
            *"//postgres:"*)
              echo "::error::L'utilisateur est « postgres » sans suffixe de tenant : le pooler le refusera avec un « password authentication failed » trompeur. Utiliser postgres.${PROD_REF}."
              exit 1 ;;
            *) echo "::warning::Utilisateur inattendu dans l'URL — on tente." ;;
          esac

      # « password authentication failed » ne dit RIEN de ce qui cloche : mot de
      # passe faux, espace collé au bout, retour à la ligne avalé par le champ
      # GitHub, ou caractère spécial non encodé. Quatre causes, un seul message.
      # On décrit donc la chaîne reçue SANS jamais l'exposer : longueur et classes
      # de caractères seulement, jamais le contenu. Assez pour comparer avec ce
      # qu'on croit avoir collé, trop peu pour reconstituer quoi que ce soit.
      - name: Diagnostic — décrire l'URL reçue sans la révéler
        run: |
          set -uo pipefail
          RAW="${PROD_SUPABASE_DB_URL}"
          # 1. Blancs parasites : la cause de paste la plus fréquente, et invisible.
          case "$RAW" in
            *[[:space:]]) echo "::error::La valeur du secret se termine par une espace ou un retour à la ligne — le mot de passe transmis n'est donc pas celui que tu crois. Recoller la chaîne sans blanc final." ; exit 1 ;;
            [[:space:]]*) echo "::error::La valeur du secret commence par un blanc. Recoller la chaîne sans blanc initial." ; exit 1 ;;
          esac
          # 2. Décrire le mot de passe : entre le premier ':' après '//' et le dernier '@'.
          CREDS="${RAW#*//}"; CREDS="${CREDS%@*}"
          PWD_PART="${CREDS#*:}"
          LEN=${#PWD_PART}
          NON_ALNUM=$(printf '%s' "$PWD_PART" | tr -d '[:alnum:]' | wc -c)
          echo "Mot de passe reçu : ${LEN} caractères, dont ${NON_ALNUM} non alphanumériques."
          case "$PWD_PART" in
            *%*) echo "Il contient un « % » — donc du percent-encodage, ou un « % » littéral qu'il faudrait écrire %25." ;;
          esac
          case "$PWD_PART" in
            *"[YOUR-PASSWORD]"*|*"["*"]"*)
              echo "::error::Le gabarit de Supabase a été collé tel quel : le mot de passe est encore entre crochets. Remplacer [YOUR-PASSWORD], crochets compris." ; exit 1 ;;
          esac
          if [ "$LEN" -lt 8 ]; then
            echo "::error::Mot de passe de ${LEN} caractères — trop court pour un mot de passe Supabase. La chaîne est probablement tronquée ou mal découpée."
            exit 1
          fi
          [ "$NON_ALNUM" -eq 0 ] \
            && echo "Purement alphanumérique : aucun encodage requis, une cause d'erreur en moins." \
            || echo "::warning::Il reste ${NON_ALNUM} caractère(s) non alphanumérique(s) : chacun doit être percent-encodé (@ → %40, / → %2F, # → %23, ? → %3F, & → %26, + → %2B, : → %3A, * → %2A). Si l'authentification échoue ensuite, c'est presque toujours ça."

      - name: Checkout corpus (ce repo)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: corpus

      - name: Checkout moteur (repo public)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: MBeji/yahia-quest-arena
          path: engine

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: engine/package-lock.json

      - name: Installer les dépendances du moteur
        working-directory: engine
        run: npm ci

      # Le moteur résout le corpus en `cwd()/content` : on branche le corpus privé
      # à cette place (même mécanique que content-ci.yml — zéro patch du moteur).
      - name: Brancher le corpus privé dans le moteur
        run: |
          rm -rf engine/content
          ln -s "$GITHUB_WORKSPACE/corpus/content" engine/content

      # Appel direct du CLI (et non `npm run content:emit`) : le script npm fige
      # déjà --sql-dir, et le premier flag l'emporte.
      - name: Émettre le SQL de contenu
        working-directory: engine
        run: |
          node --experimental-strip-types scripts/content/build.ts \
            --sql-dir "$GITHUB_WORKSPACE/corpus/sql/content"

      # DEUXIÈME appel, et non un drapeau oublié : `--competences` émet le
      # registre SEUL (étude 07 D-1) sans régénérer aucun sujet — l'appel
      # ci-dessus fait exactement l'inverse. Sans cette étape,
      # `_competences_registry.sql` n'était JAMAIS produit : le registre en base
      # restait figé à la migration du 2026-07-11 (57 compétences), et toute
      # compétence ajoutée depuis n'existait nulle part en prod — alors que les
      # sujets, eux, portaient déjà les tags qui la référencent. Constaté le
      # 2026-07-31 en ajoutant `num.valeur-absolue` et `stat.mode`.
      - name: Émettre le registre de compétences
        working-directory: engine
        run: |
          node --experimental-strip-types scripts/content/build.ts --competences \
            --sql-dir "$GITHUB_WORKSPACE/corpus/sql/content"

      - name: Établir le plan d'application
        id: plan
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/corpus/sql/content"
          # Le registre passe TOUJOURS en premier, et quel que soit le périmètre :
          # un sujet peut référencer une compétence toute neuve, et la jointure
          # `question_competencies` ne retiendrait rien si la ligne n'existe pas
          # encore. Il est idempotent — l'appliquer à chaque fois coûte quelques
          # secondes et supprime une classe entière de « appliqué sans effet ».
          REGISTRY="_competences_registry.sql"
          [ -f "${REGISTRY}" ] || { echo "::error::${REGISTRY} absent — l'étape d'émission du registre a-t-elle tourné ?"; exit 1; }
          if [ -n "${SUBJECTS}" ]; then
            FILES="${REGISTRY}"
            for s in ${SUBJECTS}; do
              [ "${s}.sql" = "${REGISTRY}" ] && continue
              [ -f "${s}.sql" ] || { echo "::error::Sujet inconnu : ${s}.sql introuvable."; exit 1; }
              FILES="${FILES} ${s}.sql"
            done
          else
            FILES="${REGISTRY} $(ls *.sql | grep -v "^${REGISTRY}$" | tr '\n' ' ')"
          fi
          echo "files=${FILES}" >> "$GITHUB_OUTPUT"
          echo "### Plan d'application" >> "$GITHUB_STEP_SUMMARY"
          for f in ${FILES}; do echo "- \`${f}\`" >> "$GITHUB_STEP_SUMMARY"; done

      - name: Dry-run — on s'arrête ici
        if: ${{ env.DRY_RUN != 'false' }}
        run: |
          echo "### 🧪 Dry-run : rien n'a été appliqué" >> "$GITHUB_STEP_SUMMARY"
          echo "Relancer avec dry_run=false pour appliquer."

      - name: Installer postgresql-client-17
        if: ${{ env.DRY_RUN == 'false' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common >/dev/null
          yes | sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh >/dev/null
          sudo apt-get install -y -qq postgresql-client-17 >/dev/null
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      # Filet de sécurité : un dump frais AVANT toute écriture, comme
      # db-migrate-prod.yml. On refuse d'appliquer sur un backup douteux.
      - name: Backup prod (pg_dump) AVANT application
        if: ${{ env.DRY_RUN == 'false' }}
        run: |
          set -euo pipefail
          STAMP="$(date -u +%Y%m%d-%H%M%S)"
          FILE="prod-pre-content-${STAMP}.dump"
          pg_dump "${PROD_SUPABASE_DB_URL}" -Fc --schema=public -f "$FILE"
          OBJECTS=$(pg_restore --list "$FILE" | wc -l)
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          echo "FILE=$FILE" >> "$GITHUB_ENV"
          echo "### Backup \`$FILE\` — $OBJECTS objets" >> "$GITHUB_STEP_SUMMARY"
          [ "$OBJECTS" -gt 50 ] || { echo "::error::Dump suspect ($OBJECTS objets) — abandon."; exit 1; }

      - name: Uploader le backup (rétention 14 j)
        if: ${{ env.DRY_RUN == 'false' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prod-pre-content-${{ env.STAMP }}
          path: ${{ env.FILE }}
          retention-days: 14
          if-no-files-found: error

      # Chaque fichier sujet est idempotent par construction (upsert UUIDv5 +
      # prune scopé au sujet) : rejouer est sûr. ON_ERROR_STOP + une transaction
      # par sujet — un sujet qui casse ne laisse pas la base à moitié écrite.
      - name: Appliquer le contenu
        if: ${{ env.DRY_RUN == 'false' }}
        working-directory: corpus/sql/content
        run: |
          set -euo pipefail
          for f in ${{ steps.plan.outputs.files }}; do
            echo "→ ${f}"
            psql "${PROD_SUPABASE_DB_URL}" \
              --set ON_ERROR_STOP=1 --single-transaction -q -f "${f}"
          done

      # Le SQL peut passer sans rien écrire de jouable (fichier vide, sujet dont
      # tous les chapitres ont été prunés). On recompte donc en base ce qu'on
      # vient d'appliquer, sujet par sujet, et on échoue si un sujet appliqué n'a
      # aucune question — pour qu'un canal muet ne puisse plus s'afficher vert.
      - name: Vérifier que le contenu est bien en base
        if: ${{ env.DRY_RUN == 'false' }}
        working-directory: corpus/sql/content
        run: |
          set -euo pipefail
          echo "### Contenu vérifié en base" >> "$GITHUB_STEP_SUMMARY"
          echo "| sujet | chapitres | questions |" >> "$GITHUB_STEP_SUMMARY"
          echo "| ----- | --------- | --------- |" >> "$GITHUB_STEP_SUMMARY"
          VIDES=""
          for f in ${{ steps.plan.outputs.files }}; do
            # Le registre N'EST PAS un sujet : il ne porte ni chapitre ni
            # question. Le compter comme tel le déclarait « appliqué sans effet »
            # à chaque passage — constaté le 2026-08-01 (run 30692259709) : le
            # contenu ÉTAIT bien en base, mais l'étape échouait et la release
            # n'était donc jamais journalisée. Il a son propre critère : le
            # nombre de compétences en base ne doit pas être inférieur à ce que
            # le corpus déclare.
            if [ "$f" = "_competences_registry.sql" ]; then
              DECLARE=$(node -e "
                const fs = require('fs');
                const d = process.env.GITHUB_WORKSPACE + '/corpus/content/competences';
                let n = 0;
                for (const x of fs.readdirSync(d).filter((y) => y.endsWith('.json')))
                  n += JSON.parse(fs.readFileSync(d + '/' + x, 'utf8')).competencies.length;
                process.stdout.write(String(n));")
              EN_BASE=$(psql "${PROD_SUPABASE_DB_URL}" --set ON_ERROR_STOP=1 -tAq \
                -c "SELECT count(*) FROM public.competencies;")
              echo "| \`registre de compétences\` | — | ${EN_BASE} en base / ${DECLARE} déclarées |" >> "$GITHUB_STEP_SUMMARY"
              [ "${EN_BASE:-0}" -ge "${DECLARE:-1}" ] || VIDES="${VIDES} registre(${EN_BASE}<${DECLARE})"
              continue
            fi
            # `subjects.id` EST le slug du sujet (et donc le nom du fichier) —
            # pas un UUID, contrairement aux chapitres/exercices/questions.
            SUBJECT="$(basename "$f" .sql)"
            READ=$(psql "${PROD_SUPABASE_DB_URL}" --set ON_ERROR_STOP=1 -tAq -c \
              "SELECT (SELECT count(*) FROM public.chapters WHERE subject_id = '${SUBJECT}')
                   || '|' ||
                      (SELECT count(*) FROM public.questions q
                         JOIN public.exercises e ON e.id = q.exercise_id
                         JOIN public.chapters c ON c.id = e.chapter_id
                        WHERE c.subject_id = '${SUBJECT}');")
            CH="${READ%%|*}"; QU="${READ##*|}"
            echo "| \`${SUBJECT}\` | ${CH} | ${QU} |" >> "$GITHUB_STEP_SUMMARY"
            [ "${QU:-0}" -gt 0 ] || VIDES="${VIDES} ${SUBJECT}"
          done
          if [ -n "$VIDES" ]; then
            echo "::error::Appliqué sans effet — aucun contenu en base pour :${VIDES}. La base n'a PAS le contenu attendu malgré un SQL passé sans erreur."
            exit 1
          fi

      # Le journal que le contenu perd en quittant supabase_migrations (§4.2).
      - name: Journaliser la release
        if: ${{ env.DRY_RUN == 'false' }}
        run: |
          set -euo pipefail
          SUBJECT_LIST=$(for f in ${{ steps.plan.outputs.files }}; do basename "$f" .sql; done | paste -sd, -)
          psql "${PROD_SUPABASE_DB_URL}" --set ON_ERROR_STOP=1 -q -c \
            "INSERT INTO public.content_releases (git_sha, subjects, actor)
             VALUES ('${{ github.sha }}',
                     string_to_array('${SUBJECT_LIST}', ','),
                     '${{ github.actor }} via ${{ github.workflow }}#${{ github.run_id }}');"
          echo "### ✅ Contenu appliqué et journalisé" >> "$GITHUB_STEP_SUMMARY"
